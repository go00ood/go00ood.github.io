name: "Build and Deploy"
on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2 
          bundler-cache: true


      # GitHub Actions에서 Git 기록을 정상적으로 읽는지 확인
      - name: Diagnose Git dates
        run: |
          echo "=== Git history ==="
          git rev-parse --is-shallow-repository
          git log -1 --format="%cI" -- _posts/2025-03-02-githubblog.markdown

          echo "=== Custom plugin ==="
          ls -l _plugins/
          grep -n "last_modified_at" _plugins/git_modified_date.rb

      # 기존 Jekyll 빌드
      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # GitHub Actions에서 생성한 sitemap의 수정일 확인
      - name: Check generated sitemap
        run: |
          echo "=== Old post ==="
          grep -A 1 '/posts/githubblog/' _site/sitemap.xml

          echo "=== Another old post ==="
          grep -A 1 '/posts/sg_1/' _site/sitemap.xml

          echo "=== Categories page ==="
          grep -A 1 '/categories/' _site/sitemap.xml

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
